<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Console - Agentic SDLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: #1e293b;
            border-right: 1px solid #334155;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar h2 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 12px;
            margin-top: 20px;
        }

        .sidebar h2:first-child {
            margin-top: 0;
        }

        .collection-list {
            list-style: none;
        }

        .collection-item {
            padding: 10px 12px;
            margin-bottom: 6px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .collection-item:hover {
            background: #1e293b;
            border-color: #64748b;
        }

        .collection-item.active {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        .collection-name {
            font-size: 13px;
            font-weight: 500;
        }

        .collection-count {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 3px;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 20px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .search-btn {
            padding: 10px 20px;
            background: #3b82f6;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: #2563eb;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .results-count {
            font-size: 13px;
            color: #94a3b8;
        }

        .result-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .result-item:hover {
            border-color: #64748b;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .result-title {
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 4px;
        }

        .relevance-score {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
        }

        .result-content {
            background: #0f172a;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 12px;
            max-height: 200px;
            overflow-y: auto;
            color: #cbd5e1;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .result-metadata {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            font-size: 12px;
        }

        .metadata-item {
            background: #0f172a;
            padding: 8px;
            border-radius: 4px;
            border-left: 2px solid #3b82f6;
        }

        .metadata-label {
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .metadata-value {
            color: #e2e8f0;
            word-break: break-all;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            border: 1px solid #dc2626;
        }

        .vector-preview {
            background: #0f172a;
            padding: 8px;
            border-radius: 4px;
            font-family: 'Monaco', monospace;
            font-size: 11px;
            color: #94a3b8;
            max-height: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
        }

        .tab {
            padding: 10px 16px;
            border: none;
            background: none;
            color: #94a3b8;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-size: 14px;
        }

        .tab.active {
            color: #3b82f6;
            border-bottom-color: #3b82f6;
        }

        .tab:hover {
            color: #cbd5e1;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #1e293b;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>📚 Collections</h2>
            <ul class="collection-list" id="collections"></ul>

            <h2>ℹ️ Stats</h2>
            <div id="sidebar-stats"></div>
        </div>

        <div class="main">
            <div class="header">
                <h1>🧠 RAG Console</h1>
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search documents...">
                    <button class="search-btn" onclick="performSearch()">Search</button>
                </div>
            </div>

            <div class="content">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('search')">Search</button>
                    <button class="tab" onclick="switchTab('browse')">Browse All</button>
                </div>

                <div id="search-tab">
                    <div class="stats" id="stats"></div>
                    <div id="results"></div>
                </div>

                <div id="browse-tab" style="display: none;">
                    <div id="browse-results"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let collections = {};
        let currentCollection = null;

        async function loadCollections() {
            try {
                const response = await fetch('/rag/collections');
                const data = await response.json();
                collections = data.collections || {};
                currentCollection = Object.keys(collections)[0];
                renderCollections();
                updateStats();
            } catch (error) {
                showError('Failed to load collections: ' + error.message);
            }
        }

        function renderCollections() {
            const list = document.getElementById('collections');
            list.innerHTML = '';

            for (const [name, count] of Object.entries(collections)) {
                const item = document.createElement('li');
                item.className = 'collection-item' + (name === currentCollection ? ' active' : '');
                item.innerHTML = `
                    <span class="collection-name">${escapeHtml(name)}</span>
                    <span class="collection-count">${count}</span>
                `;
                item.onclick = () => selectCollection(name);
                list.appendChild(item);
            }
        }

        function selectCollection(name) {
            currentCollection = name;
            renderCollections();
            document.getElementById('results').innerHTML = '';
            document.getElementById('browse-results').innerHTML = '';
        }

        function updateStats() {
            const total = Object.values(collections).reduce((a, b) => a + b, 0);
            const stats = document.getElementById('stats');
            stats.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Total Documents</div>
                    <div class="stat-value">${total}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Collections</div>
                    <div class="stat-value">${Object.keys(collections).length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Current Collection</div>
                    <div class="stat-value">${collections[currentCollection] || 0}</div>
                </div>
            `;

            const sidebarStats = document.getElementById('sidebar-stats');
            sidebarStats.innerHTML = `
                <div style="font-size: 12px; color: #94a3b8;">
                    <div style="margin-bottom: 8px;">
                        <strong>Total:</strong> ${total} docs
                    </div>
                    <div>
                        <strong>Current:</strong> ${collections[currentCollection] || 0} docs
                    </div>
                </div>
            `;
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                showError('Please enter a search query');
                return;
            }

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div> Searching...</div>';

            try {
                const response = await fetch(`/rag/search?query=${encodeURIComponent(query)}&collection=${currentCollection}&limit=20`);
                const data = await response.json();

                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🔍</div>
                            <h3>No results found</h3>
                            <p>Try a different search query</p>
                        </div>
                    `;
                    return;
                }

                let html = `<div class="results-header"><h2>Search Results</h2><div class="results-count">${data.results.length} result(s)</div></div>`;

                data.results.forEach(result => {
                    const relevance = Math.round((1 - result.distance) * 100);
                    const metadata = result.metadata || {};

                    html += `
                        <div class="result-item">
                            <div class="result-header">
                                <div style="flex: 1;">
                                    ${metadata.title ? `<div class="result-title">${escapeHtml(metadata.title)}</div>` : ''}
                                </div>
                                <span class="relevance-score">${relevance}% match</span>
                            </div>
                            <div class="result-content">${escapeHtml(result.content.substring(0, 500))}</div>
                            <div class="result-metadata">
                                ${Object.entries(metadata).map(([key, value]) => `
                                    <div class="metadata-item">
                                        <div class="metadata-label">${escapeHtml(key)}</div>
                                        <div class="metadata-value">${escapeHtml(String(value).substring(0, 100))}</div>
                                    </div>
                                `).join('')}
                                <div class="metadata-item">
                                    <div class="metadata-label">Distance (Similarity)</div>
                                    <div class="metadata-value">${(1 - result.distance).toFixed(3)}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                resultsDiv.innerHTML = html;
            } catch (error) {
                showError('Search failed: ' + error.message);
            }
        }

        async function browseLAll() {
            const browseDiv = document.getElementById('browse-results');
            browseDiv.innerHTML = '<div class="loading"><div class="spinner"></div> Loading...</div>';

            try {
                const response = await fetch(`/rag/browse?collection=${currentCollection}&limit=100`);
                const data = await response.json();

                if (!data.documents || data.documents.length === 0) {
                    browseDiv.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <h3>No documents in collection</h3>
                        </div>
                    `;
                    return;
                }

                let html = `<h2>All Documents (${data.documents.length})</h2>`;

                data.documents.forEach(doc => {
                    const metadata = doc.metadata || {};

                    html += `
                        <div class="result-item">
                            ${metadata.title ? `<div class="result-title">${escapeHtml(metadata.title)}</div>` : ''}
                            <div class="result-content">${escapeHtml(doc.content.substring(0, 500))}</div>
                            <div class="result-metadata">
                                ${Object.entries(metadata).map(([key, value]) => `
                                    <div class="metadata-item">
                                        <div class="metadata-label">${escapeHtml(key)}</div>
                                        <div class="metadata-value">${escapeHtml(String(value).substring(0, 100))}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });

                browseDiv.innerHTML = html;
            } catch (error) {
                showError('Browse failed: ' + error.message);
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('[id$="-tab"]').forEach(t => t.style.display = 'none');

            event.target.classList.add('active');
            document.getElementById(tab + '-tab').style.display = 'block';

            if (tab === 'browse') {
                browseLAll();
            }
        }

        function showError(message) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Load collections on page load
        loadCollections();
    </script>
</body>
</html>

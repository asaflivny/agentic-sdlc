services:
  asdlc:
    build: .
    ports:
      - "9090:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - API_KEY=${API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_PATH=/data/asdlc.db
    volumes:
      - asdlc-data:/data
      # Mount host repos so git tools can read them
      - ${REPOS_ROOT:-/tmp}:/repos:ro
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  asdlc-data:
  ollama-data:

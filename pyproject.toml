[project]
name = "agentic-sdlc"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "gitpython>=3.1.0",
    "aiosqlite>=0.19.0",
    "jinja2>=3.0.0",
    "tiktoken>=0.5.0",
    "langgraph>=1.2,<2",
    "langchain-core>=1.0,<2",
    "langchain-ollama>=1.1,<2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pyyaml>=6.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4",
]

[project.scripts]
asdlc = "replay:main"
asdlc-replay = "replay:replay_main"
asdlc-ingest = "ingest:ingest_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "models*", "workflows*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
